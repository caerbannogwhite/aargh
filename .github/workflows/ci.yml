name: CI

on:
  push:
    branches: [main, "dev-*"]
  pull_request:
  workflow_dispatch: # allow re-running CI on demand (e.g. after a runner outage)

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Generated code is up to date
        if: runner.os == 'Linux'
        run: |
          go generate ./series/
          git diff --exit-code

      - name: Build examples
        if: runner.os == 'Linux'
        run: go -C examples build ./...

      # -short skips loading the large local-only benchmark fixtures.
      - name: Test
        run: go test -short -count=1 ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test with race detector
        run: go test -race -short -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Build golangci-lint with the project's Go toolchain. Prebuilt release
      # binaries (what golangci-lint-action downloads) lag new Go releases, and
      # golangci-lint refuses to run when its build-Go is older than the module's
      # go directive — which broke CI after the go1.26.5 bump. `go run` builds it
      # with our toolchain, so there is no version skew. Pinned for reproducibility.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...